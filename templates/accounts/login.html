{% extends 'base.html' %}

{% block title %}Log In - Toolyt{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Sign in to Toolyt</h2>
            <p class="text-xs text-gray-500 mt-1">Convert your videos to YouTube Shorts</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="p-3 bg-red-50 text-red-700 text-xs rounded-lg border border-red-200">
                {{ form.non_field_errors }}
            </div>
            {% endif %}

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Username</label>
                <input type="text" name="username" required autofocus class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500">
            </div>

            <button type="submit" class="w-full py-2.5 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow-sm transition text-sm">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500 border-t pt-4">
            Don't have an account? <a href="{% url 'accounts:register' %}" class="text-red-600 hover:underline font-medium">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
