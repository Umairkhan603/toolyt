{% extends 'base.html' %}

{% block title %}Delete Video - Toolyt{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="bg-white p-6 rounded-2xl border border-gray-200 text-center shadow-sm">
        <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="alert-triangle" class="w-6 h-6"></i>
        </div>
        <h2 class="text-lg font-bold text-gray-900">Delete Video Source?</h2>
        <p class="text-xs text-gray-500 mt-2">
            Are you sure you want to delete <span class="font-semibold text-gray-800">"{{ video.title }}"</span>? This will remove the source file from our storage. This action cannot be undone.
        </p>

        <form method="post" class="mt-6 flex space-x-3 justify-center">
            {% csrf_token %}
            <a href="{% url 'videos:detail' video_id=video.id %}" class="px-4 py-2 border border-gray-300 rounded-lg text-xs font-semibold text-gray-700 hover:bg-gray-50">
                Cancel
            </a>
            <button type="submit" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-semibold shadow-sm transition">
                Yes, Delete Video
            </button>
        </form>
    </div>
</div>
{% endblock %}
